  <path d="M 80 40 Q 60 70 43 93" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 80 40 Q 100 70 117 93" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Telegram Paper Plane Logo on front -->
  <path d="M 72 74 L 89 67 L 85 82 L 80 77 L 76 79 Z" fill="#38bdf8"/>
  <!-- Visor / Peak -->
  <path d="M 32 94 C 32 94 48 116 80 116 C 112 116 128 94 128 94 C 122 108 105 122 80 122 C 55 122 38 108 32 94 Z" fill="url(#visorGrad)" stroke="#7dd3fc" stroke-width="2"/>
